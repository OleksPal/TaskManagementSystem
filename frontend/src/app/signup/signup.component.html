<div class="cotainer">
    <div class="row justify-content-center">
        <div class="col-md-8">
                <div class="card">
                    <div class="card-header">Register</div>
                    <div class="card-body">
                        <form [formGroup]="signupForm">
                            <div class="form-group row my-2">
                                <label class="col-md-4 col-form-label text-md-right">Email Address</label>
                                <div class="col-md-6">
                                    <input type="email" formControlName="email" class="form-control" name="email">
                                </div>
                            </div>

                            <div class="form-group row my-2">
                                <label class="col-md-4 col-form-label text-md-right">User Name</label>
                                <div class="col-md-6">
                                    <input type="text" formControlName="username" class="form-control" name="username">
                                </div>
                            </div>

                            <div class="form-group row my-2">
                                <label class="col-md-4 col-form-label text-md-right">Password</label>
                                <div class="col-md-6">
                                    <input type="password" formControlName="password" class="form-control" name="password">
                                </div>
                            </div>

                            <div class="form-group row my-2">
                                <label class="col-md-4 col-form-label text-md-right">Confirm Password</label>
                                <div class="col-md-6">
                                    <input type="password" formControlName="confirmedPassword" class="form-control" name="confirmedPassword">
                                </div>
                            </div>

                            <div class="my-4">
                                <div class="col-md-6 offset-md-4">
                                    <button (click)="onRegister()" [disabled]="signupForm.value.password !== signupForm.value.confirmedPassword" class="btn btn-primary px-3">
                                    Register
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
        </div>
    </div>
</div>
