<div class="cotainer pt-5">
    <div class="d-flex justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">Log In</div>
                <div class="card-body">
                    <form>
                        <div class="form-group row my-2">
                            <label class="col-md-4 col-form-label text-md-right">Email/Username</label>
                            <div class="col-md-6">
                                <input type="text" formControlName="login" class="form-control" name="login">
                            </div>
                        </div>

                        <div class="form-group row my-2">
                            <label class="col-md-4 col-form-label text-md-right">Password</label>
                            <div class="col-md-6">
                                <input type="password" formControlName="password" class="form-control" name="password">
                            </div>
                        </div>

                        <div class="my-4">
                            <div class="col-md-6 offset-md-4">
                                <button class="btn btn-primary px-3">
                                Log In
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
